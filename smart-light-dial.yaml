# ESP32-S3 Knob Touch LCD 1.8: encrypted Home Assistant connection and
# an independent light-zone mode picker. A touch opens a zone; a three-second
# dwell on a mode applies it through Home Assistant.
esphome:
  name: smart-light-dial
  friendly_name: Smart Light Dial
  on_boot:
    priority: -100
    then:
      - component.update: main_display

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

spi:
  type: quad
  clk_pin: GPIO13
  data_pins: [GPIO15, GPIO16, GPIO17, GPIO18]

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO47

light:
  - platform: monochromatic
    id: screen_backlight
    name: Screen Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    initial_state:
      brightness: 80%
    entity_category: config

font:
  - file: "gfonts://Manrope@600"
    id: font_label
    size: 15
  - file: "gfonts://Manrope@500"
    id: font_body
    size: 21
  - file: "gfonts://Manrope@500"
    id: font_title
    size: 43
  - file: "gfonts://Manrope@500"
    id: font_hero
    size: 53

globals:
  - id: selected_zone
    type: int
    restore_value: no
    initial_value: '0'
  - id: mode_page
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: selected_mode
    type: int
    restore_value: no
    initial_value: '0'
  - id: mode_sent
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: dwell_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: dwell_started_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_touch_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

i2c:
  sda: GPIO11
  scl: GPIO12
  scan: true

touchscreen:
  - platform: cst816
    id: dial_touch
    display: main_display
    interrupt_pin: GPIO9
    reset_pin: GPIO10
    on_touch:
      - if:
          condition:
            lambda: 'return millis() - id(last_touch_ms) > 400;'
          then:
            - lambda: |-
                id(last_touch_ms) = millis();
                id(mode_page) = !id(mode_page);
                id(mode_sent) = false;
                id(dwell_active) = false;
                if (id(mode_page)) {
                  const char *applied = id(room_a_mode).state.c_str();
                  if (id(selected_zone) == 1) applied = id(room_b_mode).state.c_str();
                  if (id(selected_zone) == 2) applied = id(room_c_mode).state.c_str();
                  const char *modes[] = {"Cool Mode", "Morning", "Warm Fire Light",
                                         "About to Sleep", "Off"};
                  id(selected_mode) = 0;
                  for (int i = 0; i < 5; i++) {
                    if (strcmp(applied, modes[i]) == 0) id(selected_mode) = i;
                  }
                }
            - script.stop: apply_preview_after_dwell
            - component.update: main_display

select:
  # Home Assistant reacts to this one telemetry entity. The dial never needs
  # permission to invoke arbitrary Home Assistant services.
  - platform: template
    id: zone_mode_request
    name: Zone Mode Request
    optimistic: true
    options:
      - Idle
      - Room A / Cool Mode
      - Room A / Morning
      - Room A / Warm Fire Light
      - Room A / About to Sleep
      - Room A / Off
      - Room B / Cool Mode
      - Room B / Morning
      - Room B / Warm Fire Light
      - Room B / About to Sleep
      - Room B / Off
      - Room C / Cool Mode
      - Room C / Morning
      - Room C / Warm Fire Light
      - Room C / About to Sleep
      - Room C / Off

script:
  - id: apply_preview_after_dwell
    mode: restart
    then:
      - delay: 3s
      - lambda: 'id(dwell_active) = false;'
      - if:
          condition:
            lambda: 'return id(mode_page) && id(dial_online).state;'
          then:
            - lambda: |-
                const char *zones[] = {"Room A", "Room B", "Room C"};
                const char *modes[] = {"Cool Mode", "Morning", "Warm Fire Light",
                                       "About to Sleep", "Off"};
                std::string request = std::string(zones[id(selected_zone)]) +
                                      " / " + modes[id(selected_mode)];
                // Toggle to Idle so reapplying the same preset produces a new
                // Home Assistant state change and reruns the automation.
                id(zone_mode_request).publish_state("Idle");
                id(zone_mode_request).publish_state(request);
                id(mode_sent) = true;
            - component.update: main_display
          else:
            - component.update: main_display

display:
  - platform: mipi_spi
    id: main_display
    model: JC3636W518V2
    data_rate: 80MHz
    color_order: rgb
    cs_pin: GPIO14
    reset_pin: GPIO21
    invert_colors: true
    dimensions:
      height: 360
      width: 360
    # A full QSPI frame is expensive; redraw only when the view changes.
    update_interval: never
    lambda: |-
      // Keep all text within the round panel's 143px safe radius.
      const Color ink(32, 39, 36);
      const Color muted(102, 112, 107);
      const Color warning(155, 81, 62);
      const Color paper(234, 236, 232);
      it.fill(paper);
      const bool wifi_ok = wifi::global_wifi_component->is_connected();
      const bool ha_ok = id(dial_online).state;
      // A short baseline carries the three-second hold without encircling
      // the content. On room pages it acts as a quiet touch affordance.
      it.filled_rectangle(132, 304, 96, 3, Color(199, 205, 199));
      if (id(mode_page) && id(dwell_active)) {
        const uint32_t elapsed = millis() - id(dwell_started_ms);
        const int width = elapsed >= 3000 ? 96 : int(elapsed * 96 / 3000);
        it.filled_rectangle(132, 304, width, 3, ink);
      } else if (!id(mode_page)) {
        it.filled_rectangle(163, 304, 34, 3, ink);
      }
      const char *applied = id(room_a_mode).state.c_str();
      if (id(selected_zone) == 1) applied = id(room_b_mode).state.c_str();
      if (id(selected_zone) == 2) applied = id(room_c_mode).state.c_str();
      const char *mode_names[] = {"Cool Mode", "Morning", "Warm Fire Light",
                                  "About to Sleep", "Off"};
      const char *zone = "Room A";
      const char *zone_caps = "ROOM A";
      const char *state = id(room_a_state).state.c_str();
      if (id(selected_zone) == 1) {
        zone = "Room B";
        zone_caps = "ROOM B";
        state = id(room_b_state).state.c_str();
      } else if (id(selected_zone) == 2) {
        zone = "Room C";
        zone_caps = "ROOM C";
        state = id(room_c_state).state.c_str();
      }
      if (!id(mode_page)) {
        it.printf(180, 103, id(font_label), muted, TextAlign::CENTER,
                  "ROOM  %d / 3", id(selected_zone) + 1);
        if (id(selected_zone) == 2) {
          it.print(180, 172, id(font_title), ink, TextAlign::CENTER, zone);
        } else {
          it.print(180, 177, id(font_hero), ink, TextAlign::CENTER, zone);
        }
        const bool known = ha_ok && (strcmp(state, "on") == 0 || strcmp(state, "off") == 0);
        const bool on = known && strcmp(state, "on") == 0;
        const char *label = !ha_ok ? (wifi_ok ? "Home offline" : "Wi-Fi down") :
                            !known ? "Syncing lights" :
                            on ? "Lights on" : "Lights off";
        it.print(180, 261, id(font_body), ha_ok ? muted : warning,
                 TextAlign::CENTER, label);
      } else {
        const char *title_top[] = {"Cool mode", "Morning", "Warm fire",
                                   "About to", "Off"};
        const char *title_bottom[] = {"", "", "light", "sleep", ""};
        it.printf(180, 103, id(font_label), muted, TextAlign::CENTER,
                  "%s  ·  %d / 5", zone_caps, id(selected_mode) + 1);
        if (title_bottom[id(selected_mode)][0] == '\0') {
          it.print(180, 184, id(font_hero), ink, TextAlign::CENTER,
                   title_top[id(selected_mode)]);
        } else {
          it.print(180, 172, id(font_title), ink, TextAlign::CENTER,
                   title_top[id(selected_mode)]);
          it.print(180, 215, id(font_title), ink, TextAlign::CENTER,
                   title_bottom[id(selected_mode)]);
        }
        const bool confirmed = id(mode_sent) &&
                               strcmp(applied, mode_names[id(selected_mode)]) == 0;
        if (!ha_ok) {
          it.print(180, 261, id(font_body), warning, TextAlign::CENTER,
                   wifi_ok ? "Home offline" : "Wi-Fi down");
        } else if (id(dwell_active)) {
          const uint32_t elapsed = millis() - id(dwell_started_ms);
          const int remaining = elapsed >= 3000 ? 1 : 3 - int(elapsed / 1000);
          it.printf(180, 261, id(font_body), muted, TextAlign::CENTER,
                    "Set in %ds", remaining);
        } else {
          const char *prompt = confirmed ? "Applied" :
                               id(mode_sent) ? "Applying" :
                               strcmp(applied, mode_names[id(selected_mode)]) == 0 ?
                                 "Active" : "Pause to set";
          it.print(180, 261, id(font_body), muted, TextAlign::CENTER, prompt);
        }
      }

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  min_auth_mode: WPA2
  power_save_mode: none
  reboot_timeout: 10min
  on_connect:
    - component.update: main_display
  on_disconnect:
    - component.update: main_display

# Home Assistant is the client. Noise encryption authenticates it and protects
# device state; the API does not need a Home Assistant access token on the dial.
api:
  encryption:
    key: !secret api_key
  homeassistant_states: true
  # A Home Assistant restart should not repeatedly reboot a healthy dial.
  reboot_timeout: 0s

ota:
  - platform: esphome
    # ESPHome supports encrypted OTA when configured with this API key.
    encryption:

binary_sensor:
  # This board sends separate clockwise/counter-clockwise pulses on GPIO8/7;
  # it does not expose a conventional quadrature encoder.
  - platform: gpio
    id: knob_clockwise
    internal: true
    pin:
      number: GPIO8
      mode: INPUT_PULLUP
      inverted: true
    use_interrupt: true
    filters:
      - delayed_on: 2ms
      - delayed_off: 5ms
    on_press:
      - lambda: |-
          if (id(mode_page)) {
            id(selected_mode) = (id(selected_mode) + 1) % 5;
            id(mode_sent) = false;
            id(dwell_active) = true;
            id(dwell_started_ms) = millis();
          } else {
            id(selected_zone) = (id(selected_zone) + 1) % 3;
          }
      - if:
          condition:
            lambda: 'return id(mode_page);'
          then:
            - script.execute: apply_preview_after_dwell
      - component.update: main_display
  - platform: gpio
    id: knob_anticlockwise
    internal: true
    pin:
      number: GPIO7
      mode: INPUT_PULLUP
      inverted: true
    use_interrupt: true
    filters:
      - delayed_on: 2ms
      - delayed_off: 5ms
    on_press:
      - lambda: |-
          if (id(mode_page)) {
            id(selected_mode) = (id(selected_mode) + 4) % 5;
            id(mode_sent) = false;
            id(dwell_active) = true;
            id(dwell_started_ms) = millis();
          } else {
            id(selected_zone) = (id(selected_zone) + 2) % 3;
          }
      - if:
          condition:
            lambda: 'return id(mode_page);'
          then:
            - script.execute: apply_preview_after_dwell
      - component.update: main_display
  - platform: status
    id: dial_online
    internal: true
    on_state:
      - component.update: main_display

sensor:
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: homeassistant
    id: room_a_mode
    entity_id: input_select.room_a_mode
    internal: true
    on_value:
      - component.update: main_display
  - platform: homeassistant
    id: room_b_mode
    entity_id: input_select.room_b_mode
    internal: true
    on_value:
      - component.update: main_display
  - platform: homeassistant
    id: room_c_mode
    entity_id: input_select.room_c_mode
    internal: true
    on_value:
      - component.update: main_display
  - platform: homeassistant
    id: room_a_state
    entity_id: light.room_a
    internal: true
    on_value:
      - lambda: |-
          ESP_LOGI("light_state", "Room A: %s", x.c_str());
      - component.update: main_display
  - platform: homeassistant
    id: room_b_state
    entity_id: light.room_b
    internal: true
    on_value:
      - lambda: |-
          ESP_LOGI("light_state", "Room B: %s", x.c_str());
      - component.update: main_display
  - platform: homeassistant
    id: room_c_state
    entity_id: light.room_c
    internal: true
    on_value:
      - lambda: |-
          ESP_LOGI("light_state", "Room C: %s", x.c_str());
      - component.update: main_display
  - platform: wifi_info
    ip_address:
      name: Dial IP Address
      entity_category: diagnostic

# Refresh the countdown while a mode is waiting to apply.
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(mode_page) && id(dwell_active);'
          then:
            - component.update: main_display
