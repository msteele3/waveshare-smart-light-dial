# Example entry for automations.yaml. Replace the trigger's entity ID if
# Home Assistant gives your dial select a different name. Make scenes named
# scene.bedliving_roomool_mode, scene.bedroom_morning, etc. for all non-Off presets.
- id: smart_light_dial_apply_request
  alias: Smart light dial - apply request
  mode: queued
  triggers:
    - trigger: state
      entity_id: select.waveshare_knob_zone_mode_request
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.to_state is not none and
           trigger.to_state.state not in ['Idle', 'unknown', 'unavailable'] and
           ' / ' in trigger.to_state.state }}
  actions:
    - variables:
        request: "{{ trigger.to_state.state }}"
    - variables:
        zone: "{{ request.split(' / ')[0] }}"
        preset: "{{ request.split(' / ')[1] }}"
    - variables:
        zone_slug: "{{ {'Bedroom': 'bedroom', 'Bathroom': 'bathroom', 'Living Room': 'living_room'}.get(zone, '') }}"
    - condition: template
      value_template: "{{ zone_slug != '' and preset in ['Cool Mode', 'Morning', 'Warm Fire Light', 'About to Sleep', 'Off'] }}"
    - action: input_select.select_option
      target:
        entity_id: "{{ 'input_select.knob_' ~ zone_slug ~ '_mode' }}"
      data:
        option: "{{ preset }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ preset == 'Off' }}"
          sequence:
            - action: light.turn_off
              target:
                entity_id: "{{ {'bedroom': 'light.matt_bedroom_lights', 'bathroom': 'light.tfl_lr1', 'living_room': 'light.living_room_lights'}[zone_slug] }}"
      default:
        - action: scene.turn_on
          target:
            entity_id: "{{ 'scene.' ~ zone_slug ~ '_' ~ (preset | lower | replace(' ', '_')) }}"
