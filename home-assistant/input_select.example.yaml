# Add these under input_select: in your Home Assistant configuration,
# or create three equivalent helpers in the UI. Do not paste this file as-is
# if input_select: is already defined in the same configuration file.
knob_bedroom_mode:
  name: Bedroom Mode
  options:
    - Cool Mode
    - Morning
    - Warm Fire Light
    - About to Sleep
    - Off
  initial: Off
knob_bathroom_mode:
  name: Bathroom Mode
  options:
    - Cool Mode
    - Morning
    - Warm Fire Light
    - About to Sleep
    - Off
  initial: Off
knob_living_room_mode:
  name: Living Room Mode
  options:
    - Cool Mode
    - Morning
    - Warm Fire Light
    - About to Sleep
    - Off
  initial: Off
